<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Agentic Dating</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

<style>
:root{--bg:#EDEFF7;--card:#fff;--ink:#16183A;--muted:#5C6080;--line:#D5D9EA;
--a:#5B3FD1;--a-t:#E3DDFA;--b:#C2305F;--b-t:#F8DCE6;--ok:#1F7A5C;--err:#B3261E;
--r:12px;--head:"Bricolage Grotesque",system-ui,sans-serif;--body:"DM Sans",system-ui,sans-serif}

*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
a{color:inherit}
:focus-visible{outline:3px solid var(--a);outline-offset:2px;border-radius:6px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:24px}
.logo{font:800 20px var(--head);text-decoration:none;letter-spacing:-.02em}
.logo i{font-style:normal;color:var(--a)}
nav{display:flex;gap:6px;margin-left:auto}
nav a{padding:7px 14px;border-radius:99px;text-decoration:none;font-weight:500}
nav a.on{background:var(--ink);color:#fff}
main{max-width:1080px;margin:0 auto;padding:32px 20px 80px}
h1{font:800 clamp(30px,5vw,48px)/1.08 var(--head);letter-spacing:-.03em;margin:0 0 10px}
h2{font:700 22px var(--head);margin:0 0 14px;letter-spacing:-.01em}
h3{font:700 16px var(--head);margin:0 0 10px}
.muted{color:var(--muted)}
.btn{display:inline-block;border:0;background:var(--ink);color:#fff;font:700 15px var(--body);padding:11px 20px;border-radius:99px;cursor:pointer;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn:disabled{opacity:.5;cursor:wait}
.best{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:22px 0 30px;padding:16px 18px;background:var(--card);border-radius:var(--r);border:1px solid var(--line)}
.best b{font:800 30px var(--head);color:var(--a)}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
input,select{font:16px var(--body);color:var(--ink);padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;width:100%}
.tools input{max-width:320px}.tools select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-decoration:none}
.tile:hover{border-color:var(--ink)}
.tile .h{display:flex;gap:12px;align-items:center}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:800 17px var(--head)}
.av.big{width:76px;height:76px;font-size:28px}
.tile b{font:700 17px var(--head);line-height:1.2}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;color:var(--muted)}
.tile small{color:var(--muted);margin-top:auto}
.phead{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.phead h1{margin:0;font-size:clamp(28px,4vw,40px)}
.links{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.links a{font-size:14px;font-weight:700;padding:5px 12px;border:1.5px solid var(--line);border-radius:99px;text-decoration:none}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:22px 0}
.tabs a{padding:10px 18px;text-decoration:none;font-weight:700;color:var(--muted);margin-bottom:-2px;border-bottom:2px solid transparent}
.tabs a.on{color:var(--ink);border-color:var(--ink)}
.summary{font-size:18px;line-height:1.6;max-width:68ch;margin:0 0 28px}
.secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.tag{font-size:12px;font-weight:700;background:var(--b-t);color:var(--b);padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.sec ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.sec li b{display:block;font-weight:700}
.sec li q{display:block;font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin-top:3px;quotes:none}
.rows{display:grid;gap:12px}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.rank{font:800 26px var(--head);color:var(--muted);text-align:center}
.row:first-child .rank{color:var(--a)}
.row p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.row .nm{font:700 18px var(--head);text-decoration:none}
.sc{text-align:right}.sc b{font:800 30px var(--head);display:block;line-height:1}
.sc small{color:var(--muted);display:block;margin:4px 0 8px}
.bar2{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px;min-width:120px}
.bar2 i{display:block;height:100%;background:var(--a)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.vs div{padding:16px;border-radius:var(--r)}
.vs .l{background:var(--a-t)}.vs .r{background:var(--b-t);text-align:right}
.vs b{font:800 22px var(--head);display:block}
.vs span{font:800 34px var(--head)}
.chat{display:grid;gap:12px;max-width:760px}
.m{max-width:82%;padding:12px 16px;border-radius:18px}
.m small{display:block;font-weight:700;font-size:13px;margin-bottom:2px}
.m.l{background:var(--a-t);border-bottom-left-radius:4px}
.m.r{background:var(--b-t);border-bottom-right-radius:4px;justify-self:end}
.m.in{animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.det{list-style:none;margin:8px 0;padding:0;display:grid;gap:6px;font-size:14px}.det li{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center}.det .bar2{margin:0}.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:26px}
.why div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
form{display:grid;gap:14px;max-width:520px}
label{font-weight:700;font-size:14px;display:grid;gap:6px}
.steps{list-style:none;padding:0;margin:24px 0;display:grid;gap:10px;max-width:520px}
.steps li{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--muted)}
.steps li.now{color:var(--ink);border-color:var(--ink);font-weight:700}
.steps li.ok{color:var(--ok)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;flex:none}
.ok .dot{background:currentColor}
.now .dot{border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{background:#FBE9E7;color:var(--err);padding:12px 16px;border-radius:10px;font-weight:500;max-width:520px}
.empty{padding:28px;background:var(--card);border:1px dashed var(--line);border-radius:var(--r);max-width:560px}
@media(max-width:560px){.row{grid-template-columns:34px 1fr}.sc{grid-column:2;text-align:left}.m{max-width:94%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<body>

<header><div class="bar">
<a class="logo" href="#/">Agentic<i>Dating</i></a>
<nav><a href="#/" id="n1">People</a><a href="#/add" id="n2">Add a person</a></nav>
</div></header>

<main id="app"></main>

<script>

const app=document.getElementById("app");

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const api=async(u,o)=>{const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||"Request failed");return d;};

const TINT=["#DCD6F7","#F6D5E0","#D2E8E4","#F3E6C4","#D5E0F5","#E7D3EE"];

const av=(n,big)=>`<span class="av${big?" big":""}" style="background:${TINT[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%6]}">${esc(n.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase())}</span>`;

const list=x=>x==null?[]:(Array.isArray(x)?x:[x]).map(i=>typeof i==="string"?{trait:i}:i).filter(i=>i&&i.trait);

const SECS=[["needs","Needs"],["hobbies","Hobbies"],["interests","Interests"],["values","Values"],["communication_style","Communication style"],["looking_for_in_a_partner","Would suit them","inferred"],["dealbreakers","Dealbreakers"]];

const nav=h=>{document.getElementById("n1").className=h==="p"?"on":"";document.getElementById("n2").className=h==="add"?"on":"";};

const fail=e=>{app.innerHTML=`<div class="err">${esc(e.message)}</div>`;};


async function home(){

  nav("p");
  app.innerHTML=`<p class="muted">Loading people...</p>`;

  const [s,ppl]=await Promise.all([api("/api/stats"),api("/api/people")]);

  const draw=()=>{

    const q=document.getElementById("q").value.toLowerCase(),g=document.getElementById("g").value;

    const f=ppl.filter(p=>(!g||p.gender===g)&&(p.name+" "+(p.headline||"")).toLowerCase().includes(q));

    document.getElementById("grid").innerHTML=f.map(p=>`<a class="tile" href="#/p/${p.id}">

      <div class="h">${av(p.name)}<b>${esc(p.name)}</b></div>

      <span class="clamp">${esc(p.headline||p.summary||"")}</span>

      <small>${p.dates} date${p.dates===1?"":"s"}</small></a>`).join("")||`<p class="muted">No one matches that search.</p>`;

  };

  app.innerHTML=`<h1>${s.people} agents. ${s.dates} dates.</h1>

  <p class="muted" style="max-width:60ch">Each person is an agent built from their LinkedIn and Instagram. Open a profile to see what the agent found, then see who their agent liked best.</p>

  ${s.best?`<div class="best"><b>${s.best.mutual}</b><span>Best match so far: ${esc(s.best.a)} and ${esc(s.best.b)}</span><a class="btn alt" href="#/d/${s.best.id}">Watch the date</a></div>`:""}

  <div class="tools"><input id="q" placeholder="Search by name or job" aria-label="Search"><select id="g" aria-label="Filter"><option value="">Everyone</option><option value="woman">Women</option><option value="man">Men</option></select></div>

  <div class="grid" id="grid"></div>`;

  document.getElementById("q").oninput=draw;
  document.getElementById("g").onchange=draw;
  draw();

}


async function profile(id,tab){

  nav("p");
  app.innerHTML=`<p class="muted">Loading profile...</p>`;

  const p=await api("/api/people/"+id),pr=p.profile||{};

  const fix=i=>{
    if(typeof i==="string"){
      const s=i.trim();
      if(s[0]==="{"){
        try{return JSON.parse(s)}catch(e){}
      }
      return {trait:i};
    }
    return i;
  };

  const list=x=>x==null?[]:(Array.isArray(x)?x:[x]).map(fix).filter(i=>i&&i.trait);

  const body=tab==="matches"?await matchesView(id):`
    ${pr.summary?`<p class="summary">${esc(pr.summary)}</p>`:""}
    <div class="secs">${SECS.map(([k,t,tag])=>{
      const it=list(pr[k]);
      return `<section class="sec">
        <h2>${t}${tag?`<span class="tag">Inferred</span>`:""}</h2>
        <ul>${it.map(i=>`<li><b>${esc(i.trait)}</b>${i.evidence?`<q>${esc(i.evidence)}</q>`:""}</li>`).join("")}</ul>
      </section>`;
    }).join("")}</div>
  `;

  app.innerHTML=`<div class="phead">${av(p.name,1)}<div><h1>${esc(p.name)}</h1>
    <div class="muted">${esc(p.headline||"")}${p.location?` &nbsp;|&nbsp; ${esc(p.location)}`:""}</div>
    <div class="links"><a href="${esc(p.linkedin_url)}" target="_blank" rel="noopener">LinkedIn</a><a href="${esc(p.instagram_url)}" target="_blank" rel="noopener">Instagram</a></div></div></div>
    <div class="tabs"><a href="#/p/${id}" class="${tab==="matches"?"":"on"}">Profile</a><a href="#/p/${id}/matches" class="${tab==="matches"?"on":""}">Best matches</a></div>${body}`;

  const rb=document.getElementById("rundates");

  if(rb)rb.onclick=()=>track(
    api("/api/people/"+id+"/dates",{method:"POST"}),
    document.getElementById("jobbox"),
    ()=>profile(id,"matches")
  );

}


async function matchesView(id){

  const m=await api("/api/people/"+id+"/matches");

  const more=`<div id="jobbox" style="margin-top:20px">${m.length<3?`<div class="empty"><b>${m.length?"Only "+m.length+" date"+(m.length>1?"s":""):"No dates yet"}.</b><p class="muted">Send this agent on dates with the most similar people.</p><button class="btn" id="rundates">Run dates</button></div>`:""}</div>`;

  if(!m.length)return more;

  return `<div class="rows">${m.map((r,i)=>`<div class="row"><div class="rank">${i+1}</div>

    <div><a class="nm" href="#/p/${r.other_id}">${esc(r.other)}</a><div class="muted" style="font-size:14px">${esc(r.headline||"")}</div>

    <p>${esc(r.my_note||"")}</p><p><a href="#/d/${r.date_id}"><b>Watch the date</b></a></p></div>

    <div class="sc"><b>${r.mutual}</b><small>match score</small><div class="bar2"><i style="width:${r.mutual}%"></i></div>

    <small>You gave ${r.my_score}. They gave ${r.their_score}.</small></div></div>`).join("")}</div>${more}`;

}


async function dateView(id){

  nav("p");
  app.innerHTML=`<p class="muted">Loading date...</p>`;

  const d=await api("/api/dates/"+id);

  const msg=m=>`<div class="m ${m.who===d.a_name?"l":"r"}"><small>${esc(m.who)}</small>${esc(m.text)}</div>`;

  app.innerHTML=`<h1>${esc(d.a_name)} meets ${esc(d.b_name)}</h1>

  <p class="muted">Two agents, each speaking only from its own person's LinkedIn and Instagram.</p>

  <div class="vs"><div class="l"><b>${esc(d.a_name)}</b><span>${d.a_score}</span></div><div class="r"><b>${esc(d.b_name)}</b><span>${d.b_score}</span></div></div>

  <p><button class="btn alt" id="rp">Replay the date</button> &nbsp; <span class="muted">Match score ${Math.round(d.mutual)}</span></p>

  <div class="chat" id="chat">${d.transcript.map(msg).join("")}</div>

  <div class="why">${[[d.a_name,d.a_plan,d.a_detail,d.a_note],[d.b_name,d.b_plan,d.b_detail,d.b_note]].map(([n,pl,dt,nt])=>`<div><h3>${esc(n)}'s agent</h3>${pl?`<p class="muted"><b>Plan:</b> ${esc(pl)}</p>`:""}${dt?`<ul class="det">${["values","lifestyle","communication","dealbreakers"].filter(k=>dt[k]!=null).map(k=>`<li><span>${k}</span><div class="bar2"><i style="width:${dt[k]}%"></i></div><b>${dt[k]}</b></li>`).join("")}</ul>`:""}<p>${esc(nt)}</p></div>`).join("")}</div>

  <p style="margin-top:22px"><a href="#/p/${d.a_id}/matches">${esc(d.a_name)}'s matches</a> &nbsp;|&nbsp; <a href="#/p/${d.b_id}/matches">${esc(d.b_name)}'s matches</a></p>`;

  document.getElementById("rp").onclick=()=>{

    const c=document.getElementById("chat");
    c.innerHTML="";

    d.transcript.forEach((m,i)=>setTimeout(()=>{
      c.insertAdjacentHTML("beforeend",msg(m).replace('class="m ','class="m in '));
    },i*1400));

  };

}


const STEPS=["Reading LinkedIn and Instagram","Writing the profile","Going on dates"];

function track(start,box,done){

  box.innerHTML=`<p class="muted">Starting...</p>`;

  start.then(r=>{

    if(r.existing){
      location.hash="#/p/"+r.existing;
      return;
    }

    const t=setInterval(async()=>{

      try{
        const j=await api("/api/jobs/"+r.job);

        const cur=j.step<=1?0:j.step===2?1:2;

        if(j.status==="error"){
          clearInterval(t);
          box.innerHTML=`<div class="err">${esc(j.msg)}</div>`;
          return;
        }

        if(j.status==="done"){
          clearInterval(t);
          done(j);
          return;
        }

        box.innerHTML=`<ul class="steps">${STEPS.map((s,i)=>`<li class="${i<cur?"ok":i===cur?"now":""}"><span class="dot"></span>${i===cur&&i===2?esc(j.msg):s}</li>`).join("")}</ul>

        ${j.person_id?`<p><a href="#/p/${j.person_id}">Profile is ready. Open it now.</a></p>`:""}`;

      }catch(e){
        clearInterval(t);
        box.innerHTML=`<div class="err">${esc(e.message)}</div>`;
      }

    },3000);

  }).catch(e=>{
    box.innerHTML=`<div class="err">${esc(e.message)}</div>`;
  });

}


function add(){

  nav("add");

  app.innerHTML=`<h1>Add a person</h1><p class="muted" style="max-width:56ch">Paste their LinkedIn and a public Instagram. The agent reads both, writes the profile, then goes on dates. This takes a few minutes. Only add people who agreed to it.</p>

  <form id="f"><label>LinkedIn link<input name="li" placeholder="https://www.linkedin.com/in/..." required></label>

  <label>Instagram link (public account)<input name="ig" placeholder="https://www.instagram.com/..." required></label>

  <label>Gender<select name="g"><option value="woman">Woman</option><option value="man">Man</option></select></label>

  <div><button class="btn" id="go">Create agent</button></div></form><div id="jobbox"></div>`;

  document.getElementById("f").onsubmit=e=>{
    e.preventDefault();
    const f=e.target;

    document.getElementById("go").disabled=true;

    track(
      api("/api/people",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          linkedin_url:f.li.value,
          instagram_url:f.ig.value,
          gender:f.g.value
        })
      }),
      document.getElementById("jobbox"),
      j=>{location.hash="#/p/"+j.person_id+"/matches";}
    );

    setTimeout(()=>{
      document.getElementById("go").disabled=false;
    },4000);
  };

}


function route(){

  const h=location.hash.slice(1)||"/",p=h.split("/");
  window.scrollTo(0,0);

  let r;

  if(p[1]==="p"&&p[2])r=profile(p[2],p[3]);
  else if(p[1]==="d"&&p[2])r=dateView(p[2]);
  else if(p[1]==="add")r=add();
  else r=home();

  if(r&&r.catch)r.catch(fail);

}

addEventListener("hashchange",route);
route();

</script>

</body>
</html>
